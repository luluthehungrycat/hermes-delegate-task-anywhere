[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-plugin-delegate-task-anywhere"
version = "0.1.0"
description = "Standalone Hermes plugin for policy-controlled cross-model and cross-profile delegation"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Mo"}]

[tool.setuptools.packages.find]
include = ["delegate_task_anywhere*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
